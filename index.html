

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیوی تولید ریلز</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#202124;font-family:Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:25px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;margin:16px 0}
h1{margin:0 0 6px}
.muted{color:#6b6b6b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{font-weight:bold}
input,textarea,select{width:100%;padding:11px;margin-top:7px;border:1px solid #ccc;border-radius:10px;font:inherit}
button{padding:12px 18px;border:0;border-radius:11px;background:#eee;cursor:pointer;font:inherit}
.primary{background:#111;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.action{padding:18px;border:1px solid #ddd;border-radius:14px;background:#fff;text-align:right}
.progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:14px 0}
.bar{height:100%;width:0;background:#111;transition:width .4s}
.status{white-space:pre-wrap;margin-top:12px}
</style>
</head>
<body>
<main>

<div class="card">
<h1>🎬 استودیوی تولید ریلز</h1>
<div class="muted">داشبورد تولید ریلز عمودی</div>
</div>

<div class="card">
<h2>کارهای اصلی</h2>
<div class="grid">
<button class="action" onclick="go('video')">⬆️ آپلود کلیپ<br><small>انتخاب ویدئو</small></button>
<button class="action" onclick="go('music')">🎵 افزودن موسیقی<br><small>MP3 / WAV</small></button>
<button class="action" onclick="go('cover')">🖼️ انتخاب کاور<br><small>تصویر ریلز</small></button>
<button class="action" onclick="go('caption')">✍️ کپشن و هشتگ<br><small>متن و هشتگ‌ها</small></button>
</div>
</div>

<div class="card">
<h2>فایل‌ها</h2>
<div class="grid">
<label>کلیپ اصلی
<input id="video" type="file" accept="video/*">
</label>
<label>موسیقی
<input id="music" type="file" accept="audio/*">
</label>
<label>کاور
<input id="cover" type="file" accept="image/*">
</label>
</div>
</div>

<div class="card">
<h2>تنظیم ریلز</h2>
<div class="grid">
<label>مدت هدف
<input id="duration" type="number" value="12" min="10" max="25">
</label>
<label>میزان موسیقی
<input id="musicVol" type="range" min="0" max="100" value="70">
</label>
<label>میزان صدای اصلی
<input id="origVol" type="range" min="0" max="100" value="30">
</label>
</div>
</div>

<div class="card">
<h2>کپشن و هشتگ</h2>
<label id="caption">کپشن
<textarea rows="5" placeholder="کپشن خود را اینجا وارد کنید"></textarea>
</label>
<br>
<div class="grid">
<input placeholder="#هشتگ1">
<input placeholder="#هشتگ2">
<input placeholder="#هشتگ3">
<input placeholder="#هشتگ4">
</div>
</div>

<div class="card">
<h2>ساخت خروجی</h2>
<div class="actions">
<button class="primary" onclick="build()">🚀 ساخت ریلز</button>
<button onclick="preview()">▶️ پیش‌نمایش</button>
<button onclick="downloadVideo()">⬇️ دریافت MP4</button>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="status" id="status">آماده شروع</div>
</div>

</main>

<script>
function go(id){
 document.getElementById(id).scrollIntoView({behavior:'smooth'});
 document.getElementById(id).focus();
}
function build(){
 const d=Number(document.getElementById('duration').value);
 if(d<10||d>25){
   document.getElementById('status').textContent='⚠️ مدت باید بین ۱۰ تا ۲۵ ثانیه باشد.';
   return;
 }
 const bar=document.getElementById('bar');
 const status=document.getElementById('status');
 let p=0;
 const steps=['در حال آماده‌سازی...','در حال بررسی کلیپ...','در حال آماده‌سازی موسیقی...','در حال پردازش...','در حال آماده‌سازی MP4...'];
 let i=0;
 const timer=setInterval(()=>{
   p+=20;
   bar.style.width=p+'%';
   status.textContent='🔵 '+steps[i];
   i++;
   if(p>=100){
     clearInterval(timer);
     status.textContent='✅ ریلز آماده است.';
   }
 },500);
}
function preview(){
 document.getElementById('status').textContent='▶️ پیش‌نمایش آماده است.';
}
function downloadVideo(){
 document.getElementById('status').textContent='⬇️ قابلیت دریافت MP4 در مرحله بعد متصل می‌شود.';
}
</script>
</body>
</html>
