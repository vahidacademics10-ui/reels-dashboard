
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیوی حرفه‌ای تولید ریلز</title>

<style>
:root{
  --bg:#03060a;
  --panel:#0b1119;
  --panel2:#101923;
  --blue:#00a8ff;
  --blue2:#0066ff;
  --yellow:#ffd21a;
  --red:#ff3030;
  --white:#f5f9ff;
  --muted:#9aaabd;
  --border:rgba(0,168,255,.65);
  --shadow:0 18px 45px rgba(0,0,0,.65);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,115,255,.17),transparent 28%),
    radial-gradient(circle at 85% 15%,rgba(255,210,20,.09),transparent 23%),
    radial-gradient(circle at 50% 90%,rgba(255,30,30,.05),transparent 25%),
    linear-gradient(145deg,#020305,#08111b 50%,#020305);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background:
    linear-gradient(rgba(0,168,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,168,255,.05) 1px,transparent 1px);
  background-size:34px 34px;
}

main{
  position:relative;
  width:min(1180px,94%);
  margin:auto;
  padding:28px 0 45px;
}

.header{
  position:relative;
  overflow:hidden;
  padding:34px 22px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:26px;
  background:
    linear-gradient(145deg,rgba(16,27,40,.98),rgba(3,8,13,.98));
  box-shadow:
    0 0 0 1px rgba(0,168,255,.1) inset,
    0 0 34px rgba(0,135,255,.15),
    var(--shadow);
}

.header:before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  top:-130px;
  right:-80px;
  border-radius:50%;
  background:rgba(0,168,255,.10);
  filter:blur(30px);
}

.header:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  box-shadow:0 0 18px var(--blue);
}

.logo{
  font-size:54px;
  filter:drop-shadow(0 0 15px rgba(0,170,255,.65));
}

h1{
  margin:8px 0 8px;
  font-size:34px;
  text-shadow:0 0 15px rgba(255,255,255,.14);
}

.subtitle{
  color:var(--muted);
  font-size:15px;
}

.status-row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.badge{
  padding:8px 13px;
  border-radius:999px;
  font-size:12px;
  border:1px solid;
  box-shadow:0 0 12px rgba(0,0,0,.25);
}

.badge.blue{
  color:#aee5ff;
  background:rgba(0,168,255,.10);
  border-color:#087fbe;
}

.badge.yellow{
  color:#ffe77a;
  background:rgba(255,210,26,.10);
  border-color:#ae8a00;
}

.badge.red{
  color:#ffaaaa;
  background:rgba(255,48,48,.09);
  border-color:#a93232;
}

.card{
  position:relative;
  margin-top:20px;
  padding:23px;
  border:1px solid var(--border);
  border-radius:21px;
  background:
    linear-gradient(145deg,rgba(15,25,36,.97),rgba(4,9,15,.98));
  box-shadow:
    0 0 0 1px rgba(0,168,255,.06) inset,
    0 0 24px rgba(0,136,255,.09),
    var(--shadow);
}

.card:before{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  box-shadow:0 0 10px var(--blue);
}

.card h2{
  margin:0 0 18px;
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

label{
  display:block;
  color:#eaf4ff;
  font-weight:bold;
}

input,textarea{
  width:100%;
  margin-top:8px;
  padding:13px 14px;
  color:#fff;
  background:#050a10;
  border:1px solid #17638e;
  border-radius:12px;
  outline:none;
  font:inherit;
  box-shadow:
    inset 0 4px 12px rgba(0,0,0,.6),
    0 0 0 rgba(0,0,0,0);
}

input:focus,textarea:focus{
  border-color:var(--blue);
  box-shadow:
    0 0 0 2px rgba(0,168,255,.10),
    0 0 17px rgba(0,168,255,.18),
    inset 0 4px 12px rgba(0,0,0,.6);
}

input[type="range"]{
  padding:0;
  height:38px;
  accent-color:var(--blue);
}

button{
  min-height:48px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:13px 19px;
  color:#fff;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;
  box-shadow:
    0 7px 0 rgba(0,0,0,.45),
    0 12px 22px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.18);
}

button:hover{
  transform:translateY(-2px);
}

button:active{
  transform:translateY(5px);
  box-shadow:
    0 2px 0 rgba(0,0,0,.45),
    0 5px 10px rgba(0,0,0,.35),
    inset 0 2px 5px rgba(0,0,0,.4);
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

.action{
  min-height:120px;
  text-align:center;
  background:linear-gradient(145deg,#162635,#07101a);
  border-color:#1778ad;
}

.action:hover{
  border-color:var(--blue);
  box-shadow:
    0 9px 0 rgba(0,0,0,.45),
    0 16px 28px rgba(0,0,0,.42),
    0 0 24px rgba(0,168,255,.23),
    inset 0 1px 0 rgba(255,255,255,.18);
}

.action .icon{
  display:block;
  font-size:31px;
  margin-bottom:7px;
}

.blue{
  background:linear-gradient(145deg,#0b97ec,#004987);
  border-color:#24bbff;
}

.yellow{
  color:#111;
  background:linear-gradient(145deg,#ffe765,#ffb900);
  border-color:#fff18a;
}

.red{
  background:linear-gradient(145deg,#ff4c4c,#a31313);
  border-color:#ff8585;
}

.white{
  color:#101419;
  background:linear-gradient(145deg,#ffffff,#bdc8d4);
  border-color:#fff;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.progress{
  height:14px;
  margin-top:20px;
  overflow:hidden;
  border:1px solid #14557b;
  border-radius:999px;
  background:#03070b;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.7);
}

.bar{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#006eff,#00d9ff);
  box-shadow:0 0 20px rgba(0,193,255,.9);
  transition:width .35s ease;
}

.status{
  margin-top:12px;
  padding:14px;
  color:#dff4ff;
  border:1px solid #174966;
  border-radius:12px;
  background:#050b11;
}

.small{
  margin-top:7px;
  color:#99aabc;
  font-size:12px;
  font-weight:normal;
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#73879a;
  font-size:12px;
}

@media(max-width:600px){
  h1{font-size:27px}
  .logo{font-size:44px}
  .card{padding:17px}
  main{width:95%}
}
</style>
</head>

<body>
<main>

<section class="header">
  <div class="logo">🎬</div>
  <h1>استودیوی حرفه‌ای تولید ریلز</h1>
  <div class="subtitle">مرکز مدیریت و آماده‌سازی ویدئوهای عمودی</div>

  <div class="status-row">
    <span class="badge blue">● سیستم آماده</span>
    <span class="badge yellow">⚡ پردازش سریع</span>
    <span class="badge red">● خروجی HD</span>
  </div>
</section>

<section class="card">
  <h2>🎛️ عملیات اصلی</h2>

  <div class="action-grid">

    <button class="action blue" onclick="go('video')">
      <span class="icon">⬆️</span>
      آپلود کلیپ
      <div class="small">انتخاب فایل ویدئویی</div>
    </button>

    <button class="action yellow" onclick="go('music')">
      <span class="icon">🎵</span>
      افزودن موسیقی
      <div class="small">MP3 / WAV</div>
    </button>

    <button class="action white" onclick="go('cover')">
      <span class="icon">🖼️</span>
      انتخاب کاور
      <div class="small">تصویر ریلز</div>
    </button>

    <button class="action red" onclick="go('caption')">
      <span class="icon">✍️</span>
      کپشن و هشتگ
      <div class="small">متن انتشار</div>
    </button>

  </div>
</section>

<section class="card">
  <h2>📁 فایل‌های پروژه</h2>

  <div class="grid">

    <label id="video">
      کلیپ اصلی
      <input id="videoFile" type="file" accept="video/*">
    </label>

    <label id="music">
      موسیقی
      <input id="musicFile" type="file" accept="audio/*">
    </label>

    <label id="cover">
      کاور
      <input id="coverFile" type="file" accept="image/*">
    </label>

  </div>
</section>

<section class="card">
  <h2>⚙️ تنظیمات ریلز</h2>

  <div class="grid">

    <label>
      مدت هدف
      <input id="duration" type="number" value="12" min="10" max="25">
    </label>

    <label>
      میزان موسیقی
      <input id="musicVol" type="range" min="0" max="100" value="70">
    </label>

    <label>
      صدای اصلی
      <input id="origVol" type="range" min="0" max="100" value="30">
    </label>

  </div>
</section>

<section class="card">
  <h2 id="caption">📝 کپشن و هشتگ</h2>

  <label>
    کپشن
    <textarea id="captionText" rows="5"
      placeholder="کپشن خود را اینجا وارد کنید..."></textarea>
  </label>

  <div class="grid" style="margin-top:16px">
    <input class="tag" placeholder="#هشتگ1">
    <input class="tag" placeholder="#هشتگ2">
    <input class="tag" placeholder="#هشتگ3">
    <input class="tag" placeholder="#هشتگ4">
  </div>
</section>

<section class="card">
  <h2>🚀 تولید خروجی</h2>

  <div class="actions">
    <button class="yellow" onclick="buildReel()">🚀 ساخت ریلز</button>
    <button class="blue" onclick="preview()">▶️ پیش‌نمایش</button>
    <button class="red" onclick="clearProject()">🗑️ پاک‌سازی</button>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="status" id="status">
    آماده شروع پروژه
  </div>
</section>

<div class="footer">
  Reel Studio • Professional Dashboard
</div>

</main>

<script>
function go(id){
  const el=document.getElementById(id);
  if(el){
    el.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

function buildReel(){
  const duration=Number(
    document.getElementById("duration").value
  );

  const bar=document.getElementById("bar");
  const status=document.getElementById("status");

  if(duration<10 || duration>25){
    status.textContent=
      "⚠️ مدت ریلز باید بین ۱۰ تا ۲۵ ثانیه باشد.";
    return;
  }

  let progress=0;

  const steps=[
    "🔵 آماده‌سازی پروژه...",
    "🟡 بررسی کلیپ...",
    "🔵 تنظیم موسیقی...",
    "🔴 پردازش ویدئو...",
    "🟢 آماده‌سازی خروجی..."
  ];

  bar.style.width="0%";

  const timer=setInterval(function(){

    progress+=20;

    bar.style.width=progress+"%";

    const stepIndex=Math.min(
      Math.floor(progress/20)-1,
      steps.length-1
    );

    status.textContent=steps[stepIndex];

    if(progress>=100){
      clearInterval(timer);

      setTimeout(function(){
        status.textContent=
          "✅ ریلز با موفقیت آماده شد.";
      },300);
    }

  },500);
}

function preview(){
  document.getElementById("status").textContent=
    "▶️ پیش‌نمایش پروژه آماده شد.";
}

function clearProject(){

  document.getElementById("videoFile").value="";
  document.getElementById("musicFile").value="";
  document.getElementById("coverFile").value="";
  document.getElementById("captionText").value="";

  document.querySelectorAll(".tag").forEach(function(tag){
    tag.value="";
  });

  document.getElementById("bar").style.width="0%";

  document.getElementById("status").textContent=
    "🗑️ اطلاعات پروژه پاک شد.";
}
</script>

</body>
</html>
